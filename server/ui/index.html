<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude 설정 지도</title>
<style>
/* 다크 기본 + prefers-color-scheme: light 오버라이드. 외부 리소스 0. */
:root{
  --bg:#191b1f; --bar:#13151a; --ed:#1e2126; --bd:#2b2f36;
  --fg:#d7dae0; --muted:#7d8590; --val:#aeb4bd;
  --acc:#8ab4f8; --sel:#2b3a55; --selfg:#ffffff;
  --green:#7ee2a8; --warn:#e3b341; --err:#ff8f8a;
  --hover:#23262c; --purple:#c29bf5;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#fafbfc; --bar:#f1f4f7; --ed:#ffffff; --bd:#dfe3e8;
    --fg:#1c2430; --muted:#5c6773; --val:#454f5b;
    --acc:#3b5bdb; --sel:#dbe7ff; --selfg:#1c2430;
    --green:#1f6b3f; --warn:#a86800; --err:#b3261e;
    --hover:#eaeef3; --purple:#6a3fb0;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.5 var(--sans);color:var(--fg);background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 스크롤바: 토큰으로 통일 — #sidebody·#panel·#tabstrip·#inspector·.desc·textarea.ta 모두 * 로 덮인다 */
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
#app{display:grid;grid-template-columns:48px 300px 1fr 260px;height:100vh;overflow:hidden}

/* ---- 액티비티 바 ---- */
#activity{background:var(--bar);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;overflow:hidden}
#logo{width:24px;height:24px;border-radius:6px;background:var(--acc);flex:none;margin-bottom:8px}
#views{display:flex;flex-direction:column;gap:4px}
#views button{width:32px;height:32px;border-radius:5px;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:center;line-height:1}
#views button:hover{background:var(--hover);color:var(--fg)}
#views button[aria-selected=true]{background:var(--bd);color:var(--fg);font-weight:700}

/* ---- 사이드바 (액티비티 바가 내용을 바꾼다) ---- */
#sidebar{border-right:1px solid var(--bd);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.pane-hd{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;font-size:11px;color:var(--muted);letter-spacing:.06em;border-bottom:1px solid var(--bd);flex:none}
#sidehint{flex:none;font-size:11px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--bd)}
#sidebody{overflow:auto;flex:1;padding:4px 0;font-size:12.5px}
/* 목록 행: 본문 버튼 + (스킬이면) 오른쪽 스위치 — 중첩 button 금지 */
.sechd{margin:10px 10px 4px;font-weight:600;font-size:12px}
#sidebody>.sechd:first-child{margin-top:4px}
.sitem{display:flex;align-items:center;gap:4px;border-left:3px solid transparent;padding-right:6px;min-width:0}
.sitem:hover{background:var(--hover)}
.sitem.sel{background:var(--sel)}
.sitem.sel .t{color:var(--selfg)}
.sitem.global{border-left-color:var(--acc)}
.sitem.project{border-left-color:var(--green)}
.sitem.plugin{border-left-color:var(--purple)}
.srow{flex:1;min-width:0;text-align:left;padding:4px 4px 4px 8px}
.srow .l1{display:flex;align-items:center;gap:6px;min-width:0}
.srow .l2{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.srow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem.dim .t{color:var(--muted)}
.row{display:flex;align-items:center;height:24px;border-left:2px solid transparent}
.row.d1,.row.d2,.row.d3{border-left-color:var(--bd)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row.sel .nm,.row.sel .num{color:var(--selfg)}
.arw{width:12px;flex:none;font-size:9px;color:var(--muted);text-align:left;padding:0;height:24px;line-height:24px}
.mn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 0;text-align:left}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.num{font:11px/1 var(--mono);color:var(--muted);flex:none}
.b{font-weight:600}
.warn{color:var(--warn)}
.off{color:var(--muted)}
.gone{text-decoration:line-through;color:var(--muted)}

/* ---- 에디터 ---- */
#editor{background:var(--ed);min-width:0;display:flex;flex-direction:column;overflow:hidden}
#tabstrip{display:flex;flex:none;background:var(--bg);border-bottom:1px solid var(--bd);overflow-x:auto;font-size:12px}
.tab{display:flex;align-items:center;flex:none;max-width:220px;border-top:2px solid transparent;border-right:1px solid var(--bd);color:var(--muted)}
.tab.act{background:var(--ed);border-top-color:var(--acc);color:var(--fg)}
.tab .tabname{display:flex;align-items:baseline;gap:6px;min-width:0;padding:5px 4px 5px 10px}
.tab .tf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ts{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .tabx{padding:5px 8px;color:var(--muted);line-height:1}
.tab .tabx:hover{color:var(--fg);background:var(--hover)}
.tab.empty{padding:5px 10px;color:var(--muted);border-right:0}
#pathline{flex:none;font:11px/1.6 var(--mono);color:var(--muted);padding:4px 12px;border-bottom:1px solid var(--bd);word-break:break-all}
#panel{flex:1;overflow:auto;min-width:0}
.code{font:12px/1.7 var(--mono);padding:8px 0}
.line{display:grid;grid-template-columns:40px 1fr}
.line .ln{text-align:right;padding-right:8px;color:var(--muted);user-select:none;white-space:pre}
.line .src{min-width:0;padding-left:10px;color:var(--fg);white-space:pre-wrap;word-break:break-all}
.code pre.rest{margin:0;padding-left:50px;white-space:pre-wrap;word-break:break-all;color:var(--fg)}
.pad{padding:12px 14px}
.hint{color:var(--muted)}
/* 뷰 역할 한 줄 설명 */
.vhint{font-size:12px;margin:0 0 10px}
.err{color:var(--err)}
.badge{display:inline-block;border:1px solid var(--bd);border-radius:10px;padding:0 7px;font-size:11px;color:var(--muted);white-space:nowrap}
.badge.warn{color:var(--warn);border-color:var(--warn)}
.badge.shared{color:var(--green);border-color:var(--green)}
.badge.off{color:var(--err);border-color:var(--err)}
/* 규칙 사이드바 순번 */
.rnum{width:20px;height:20px;flex:none;border-radius:50%;border:1px solid var(--acc);color:var(--acc);font:11px/18px var(--mono);text-align:center}
/* 인스펙터 설명 본문 */
.desc{font-size:12px;max-height:12em;overflow:auto;color:var(--val);word-break:break-word}
.desc.none{color:var(--muted)}
pre.cfg{margin:0;max-height:16em;overflow:auto;font:11px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;color:var(--val)}
.badge.k-skill{color:var(--green);border-color:var(--green)}
.badge.k-agent{color:var(--acc);border-color:var(--acc)}
.badge.k-command{color:var(--warn);border-color:var(--warn)}
/* 출처별 섹션 — 헤더 줄은 래퍼(접기 버튼 + 플러그인 스위치), 중첩 button 금지 */
.cardsechd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 8px 4px}
#cardbody>.cardsechd:first-child{margin-top:4px}
.cardsec{display:flex;align-items:center;gap:6px;flex:1;min-width:0;text-align:left;margin:0;font-weight:600}
.cardsec .arw{width:12px;height:auto;line-height:inherit}
/* 토글 컨트롤 */
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.switch{border:1px solid var(--bd);border-radius:10px;padding:1px 10px;font-size:11px;color:var(--muted);background:var(--bg)}
.switch[aria-checked=true]{color:var(--green);border-color:var(--green)}
.switch[aria-checked=false]{color:var(--err);border-color:var(--err)}
.switch[disabled]{color:var(--muted);border-color:var(--bd);cursor:default}
select.lvl,select.tgt{font:inherit;color:var(--fg);background:var(--ed);border:1px solid var(--bd);border-radius:4px;max-width:100%}
select.lvl{font-size:11px;padding:1px 4px}
select.tgt{padding:3px 6px}
select[disabled]{color:var(--muted);cursor:default}
.togglemsg{padding:5px 10px;border-bottom:1px solid var(--bd);color:var(--err);word-break:break-all}
.tbar input[type=search]{flex:1;min-width:100px;max-width:100%;font:inherit;color:var(--fg);
      background:var(--ed);border:1px solid var(--bd);border-radius:4px;padding:3px 8px}
.tbar .chip{color:var(--muted)}
.tbar .chip[aria-pressed=true]{background:var(--sel);color:var(--selfg);border-color:var(--acc)}
/* 훅 명령 목록 (인스펙터) */
.cmd{font-family:var(--mono);font-size:11px;word-break:break-all;color:var(--val)}

/* ---- 인스펙터 ---- */
#inspector{border-left:1px solid var(--bd);padding:14px 16px;font-size:12px;display:flex;flex-direction:column;gap:18px;overflow:auto;min-width:0}
.sec-t{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:8px}
.kvgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.kvgrid .k{color:var(--muted)}
.kvgrid .v{color:var(--val);word-break:break-all}
.kvgrid .v.shared{color:var(--green)}
.kvgrid .v.warn{color:var(--warn)}
.efflist,.hooklist{display:flex;flex-direction:column;gap:5px}
.effitem{display:flex;gap:6px;align-items:baseline;color:var(--val);word-break:break-all}
.effitem .n{color:var(--acc);font:11px/1.5 var(--mono);flex:none}
.effitem.cur{color:var(--fg)}
.effitem.lazyit{color:var(--warn)}
.hookitem{color:var(--val);word-break:break-all}
.spacer{flex:1;min-height:4px}
.acts{display:flex;gap:8px}
.acts button{flex:1;border:1px solid var(--bd);border-radius:4px;padding:5px;text-align:center;color:var(--fg)}
.acts button:hover{background:var(--hover)}
.acts button[disabled]{color:var(--muted);cursor:default}
.linkbtn{color:var(--err);text-decoration:underline;padding:0}
#errlist{margin-top:6px;display:flex;flex-direction:column;gap:4px}
#errlist div{color:var(--err);word-break:break-all;font-size:11px}

/* ---- 편집 모드 ---- */
.tbar{position:sticky;top:0;z-index:1;flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
      padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--bd)}
.tbar button{border:1px solid var(--bd);border-radius:4px;padding:3px 10px;color:var(--fg)}
.tbar button:hover{background:var(--hover)}
.tbar button[disabled]{color:var(--muted);cursor:default}
.tbar .hint{font-size:11px}
.edit{display:flex;flex-direction:column;height:100%;min-height:0}
.sharewarn{flex:none;padding:5px 10px;color:var(--warn);background:var(--bg);border-bottom:1px solid var(--bd)}
.edmsg{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 10px;border-bottom:1px solid var(--bd)}
.edmsg.ok{color:var(--green)}
.edmsg.bad{color:var(--err)}
textarea.ta{flex:1;min-height:160px;width:100%;resize:none;border:0;outline:none;padding:8px 10px;
            font:12px/1.7 var(--mono);color:var(--fg);background:var(--ed)}
.issues{flex:none;max-height:34%;overflow:auto;border-top:1px solid var(--bd);
        padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.iss{font-size:12px;word-break:break-all}
.iss.error{color:var(--err)}
.iss.warnlv{color:var(--warn)}
.iss .rl{font:11px/1.5 var(--mono);color:var(--muted);margin-right:6px}

@media (max-width:900px){
  #app{grid-template-columns:48px 220px 1fr;grid-template-rows:1fr auto}
  #activity{grid-row:1/3}
  #sidebar{grid-row:1/3}
  #editor{grid-column:3;grid-row:1}
  #inspector{grid-column:3;grid-row:2;border-left:0;border-top:1px solid var(--bd);max-height:42vh}
}
</style>
</head>
<body>
<div id="app">
  <nav id="activity" aria-label="사이드바 전환">
    <div id="logo" aria-hidden="true"></div>
    <div id="views" role="tablist" aria-label="사이드바 목록"></div>
  </nav>
  <nav id="sidebar" aria-label="사이드바">
    <div class="pane-hd"><span id="side-title">탐색기</span><span id="side-count"></span></div>
    <div id="sidehint"></div>
    <div id="sidebody" role="tabpanel"></div>
  </nav>
  <section id="editor">
    <div id="tabstrip"></div>
    <div id="pathline"></div>
    <div id="panel"></div>
  </section>
  <aside id="inspector" aria-label="인스펙터"></aside>
</div>
<script>
"use strict";
// ponytail: 상태는 scan 응답 하나. 라우터·프레임워크 없음.
var MIN_VER = [2,1,199];
// 액티비티 바 = 사이드바 내용 전환. 에디터는 언제나 열린 파일의 원문.
var VIEWS = [["files","파일"],["rules","규칙"],["skills","스킬"],["hooks","훅"],["mcp","MCP"]];
var VIEW_TITLE = {files:"탐색기", rules:"규칙", skills:"스킬·에이전트·커맨드", hooks:"훅", mcp:"MCP"};
// 사이드바 역할 한 줄 설명 — 사이드바 상단 문구와 액티비티 바 툴팁이 같은 문장을 쓴다
var VIEW_HINT = {
  files:"전역 · 프로젝트 · 플러그인 설정 파일 트리. 클릭하면 에디터에서 원문·편집",
  rules:"선택 프로젝트에 실제로 적용되는 CLAUDE.md 체인 — 적용 순서대로",
  skills:"전역 · 이 프로젝트 · 플러그인의 스킬/에이전트/커맨드와 이 프로젝트에서의 ON/OFF",
  hooks:"settings.json 훅을 이벤트별 매처 → 명령 순서로. 색은 출처(전역/프로젝트/플러그인)",
  mcp:"MCP 서버를 출처별로"};
var KIND_KO = {skill:"스킬", agent:"에이전트", command:"커맨드"};
var SCOPE_KO = {global:"전역",
  "global-rules":"전역 rules", project:"프로젝트", "project-local":"프로젝트 로컬",
  "project-rules":"프로젝트 rules", subdir:"하위 폴더"};
var COVER_KO = {home:"홈 디렉터리", "drive-root":"드라이브 루트", ancestor:"상위 폴더 중복"};
var MAX_TABS = 6;
var MAX_LINE_ROWS = 2000;
// sseq: 스캔 세대, fseq: 파일 세대, eseq: 유효 규칙 세대 / dead: 서버 종료 후 렌더 중단
// side: 사이드바 내용 ("files"|"rules"|"skills"|"hooks"|"mcp") — 에디터와 무관
// selHook/selMcp: 훅·MCP 사이드바에서 고른 항목 (인스펙터 표시용)
var S = {scan:null, project:null, side:"files", file:null, fileErr:null, filePath:null, msg:null, msgOk:false,
         fseq:0, sseq:0, eseq:0, loading:false, dead:false, scanErr:false,
         tabs:[], meta:Object.create(null), expanded:Object.create(null),
         eff:null, effErr:null, errOpen:false, selHook:null, selMcp:null,
         // cardq: 스킬 뷰 검색·종류 필터. 재스캔·프로젝트 전환에도 유지 (loadScan 이 건드리지 않음)
         cardq:{q:"", kinds:{skill:true, agent:true, command:true}},
         // toggleTarget: 토글 저장 대상 파일. toggleErr: 직전 토글 실패 메시지 (툴바 아래 한 줄)
         toggleTarget:"settings.local.json", toggleErr:null,
         // edit: 편집 중일 때만 객체 {path,text,dirty,issues,busy,conflict,msg,msgCls}
         edit:null, issues:null};
function retryBtn(fn){ var b = el("button","linkbtn","다시 시도"); b.onclick = fn; return b; }
// 개발용 훅: #sample 이면 정적 서버의 scan-sample.json을 스캔 응답 대신 사용
var SAMPLE = location.hash === "#sample";

function el(tag, cls, text){var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e;}
function badge(text, cls){return el("span","badge"+(cls?" "+cls:""), text);}
function viewHint(text){return el("p","hint vhint", text);}
function clear(n){while(n.firstChild) n.removeChild(n.firstChild); return n;}
function kb(n){return (typeof n==="number"? (n/1024).toFixed(1) : "?")+" KB";}
function ymd(mtime){
  if(typeof mtime!=="number") return "-";
  var d=new Date(mtime*1000), p=function(x){return (x<10?"0":"")+x;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
function len(a){ return (a||[]).length; }
function keys(o){ return Object.keys(o||{}); }
// 파싱 실패면 null (버전 미확인)
function cmpVer(str){
  var m=/(\d+)\.(\d+)\.(\d+)/.exec(str||"");
  if(!m) return null;
  for(var i=0;i<3;i++){ var a=parseInt(m[i+1],10); if(a!==MIN_VER[i]) return a-MIN_VER[i]; }
  return 0;
}
async function getJSON(url){
  var r = await fetch(url), b=null;
  try{ b = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((b&&b.error)||("HTTP "+r.status));
  if(b==null) throw new Error("응답을 읽지 못했습니다");
  return b;
}
// 편집용 POST: 상태코드로 분기해야 하므로 throw 하지 않고 {status, ok, body} 를 준다
async function postJSON(url, body){
  var r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
                            body: JSON.stringify(body)}), b = null;
  try{ b = await r.json(); }catch(e){}
  return {status:r.status, ok:r.ok, body:b || {}};
}
function resErr(res){ return (res.body && res.body.error) || ("HTTP "+res.status); }

/* ---------- 설정 조회 헬퍼 ---------- */
function settingsData(obj){
  var out = {};
  keys(obj).forEach(function(k){
    var d = obj[k] && obj[k].data;
    if(d && typeof d === "object") out[k] = d;
  });
  return out;
}
// 전역 settings.json → 전역 local → 프로젝트 settings.json → 프로젝트 local 순 병합 (뒤가 우선)
// proj 미지정이면 선택 프로젝트(S.project) 기준
function mergedSetting(key, proj){
  var res = Object.create(null), sets = [];
  var pr = (proj === undefined) ? S.project : proj;
  if(S.scan && S.scan.global) sets.push(S.scan.global.settings);
  if(pr && pr.exists !== false) sets.push(pr.settings);
  sets.forEach(function(obj){
    var all = settingsData(obj);
    ["settings.json","settings.local.json"].forEach(function(k){
      var v = all[k] && all[k][key];
      if(v && typeof v === "object") keys(v).forEach(function(n){ res[n] = v[n]; });
    });
  });
  return res;
}
function skillOverrides(proj){ return mergedSetting("skillOverrides", proj); }
function enabledPlugins(){ return mergedSetting("enabledPlugins"); }
// skillOverrides 키: 스킬은 SKILL.md면 부모 디렉터리명, 아니면 파일명(확장자 제외).
// 커맨드는 파일명에서 확장자(.md/.toml 등) 제거. 에이전트는 오버라이드 대상 아님.
function overrideKey(f, kind){
  var name = String(f.name || "");
  if(kind === "skill" && name === "SKILL.md"){
    var seg = String(f.path || "").split(/[\\/]/);
    return seg[seg.length-2] || name;
  }
  return name.replace(/\.[^.\\/]+$/,"");
}
function pluginOff(pl){ return enabledPlugins()[pl.key] === false; }
// 병합값의 출처 — mergedSetting 과 같은 순서로 훑고 마지막에 이긴 파일을 돌려준다.
// 없으면 null (= 기본값). 전역 두 파일은 묶어서 "전역 설정".
function settingSource(section, key){
  var found = null;
  function look(obj, glabel){
    var all = settingsData(obj);
    ["settings.json","settings.local.json"].forEach(function(k){
      var v = all[k] && all[k][section];
      if(v && typeof v === "object" && Object.prototype.hasOwnProperty.call(v, key))
        found = {value:v[key], file:k, label: glabel || (k === "settings.json" ? "팀 설정" : "개인 설정")};
    });
  }
  if(S.scan && S.scan.global) look(S.scan.global.settings, "전역 설정");
  if(S.project && S.project.exists !== false) look(S.project.settings, null);
  return found;
}
// 토글 가능 = 존재하는 프로젝트가 선택돼 있을 때만
function toggleReady(){ return !!(S.project && S.project.exists !== false); }
// 프로젝트 settings 두 파일에 실제로 적힌 토글 키 수 (전역 제외)
function projToggleCount(p){
  var all = settingsData(p.settings), out = {skills:0, plugins:0};
  [["skillOverrides","skills"],["enabledPlugins","plugins"]].forEach(function(pair){
    var seen = Object.create(null);
    ["settings.json","settings.local.json"].forEach(function(k){
      var v = all[k] && all[k][pair[0]];
      if(v && typeof v === "object") keys(v).forEach(function(n){ seen[n] = true; });
    });
    out[pair[1]] = keys(seen).length;
  });
  return out;
}

/* ---------- 스캔 인덱스 (경로 → 표시용 메타) ---------- */
// 재스캔 후 선택 복원 + 인스펙터 속성 표시. API 계약의 "직전 스캔에 등장한 경로"와 동일 범위.
// 프로젝트 경로 기준 상대경로 (구분자 /), 접두어가 아니면 null
function relLabel(path, base){
  var p = String(path||"").replace(/\\/g,"/");
  var b = String(base||"").replace(/\\/g,"/").replace(/\/+$/,"");
  if(!b) return null;
  return p.toLowerCase().indexOf(b.toLowerCase()+"/") === 0 ? p.slice(b.length+1) : null;
}
// 홈 디렉터리 프로젝트는 ~/.claude 항목을 전역과 같은 경로로 다시 싣는다 — 전역 쪽만 렌더
var GPATHS = Object.create(null);
function dedupProj(p){
  if(p.coverage_reason !== "home") return p;
  var dup = function(f){ return !!(f && f.path && GPATHS[f.path]); };
  var q = {};
  keys(p).forEach(function(k){ q[k] = p[k]; });
  ["claude_md","rules","skills","agents","commands"].forEach(function(k){
    if(Array.isArray(p[k])) q[k] = p[k].filter(function(f){ return !dup(f); });
  });
  var st = Object.create(null);
  keys(p.settings).forEach(function(k){ if(!dup(p.settings[k])) st[k] = p.settings[k]; });
  q.settings = st;
  return q;
}
function scanIndex(sc){
  var set = Object.create(null);
  GPATHS = Object.create(null);
  function add(f, m){
    if(!f || !f.path || set[f.path]) return;
    var lazy = f.scope === "subdir";
    set[f.path] = {scope:m.scope, origin:m.origin, project:m.project || null, shared:!!f.shared,
                   lazy:lazy, label: lazy ? relLabel(f.path, m.project) : null};
  }
  function addAll(a, m){ (a||[]).forEach(function(f){ add(f, m); }); }
  function addSettings(o, m){ keys(o).forEach(function(k){ add(o[k], m); }); }
  function addKinds(o, origin, prefix, proj){
    addAll(o.skills, {scope:prefix+" skills", origin:origin, project:proj});
    addAll(o.agents, {scope:prefix+" agents", origin:origin, project:proj});
    addAll(o.commands, {scope:prefix+" commands", origin:origin, project:proj});
  }
  var g = sc.global || {};
  [g.claude_md].concat(g.rules||[], g.skills||[], g.agents||[], g.commands||[],
    keys(g.settings).map(function(k){ return g.settings[k]; }))
    .forEach(function(f){ if(f && f.path) GPATHS[f.path] = true; });
  add(g.claude_md, {scope:"전역", origin:"전역"});
  addAll(g.rules, {scope:"전역 rules", origin:"전역"});
  addSettings(g.settings, {scope:"전역 settings", origin:"전역"});
  addKinds(g, "전역", "전역");
  (sc.projects||[]).forEach(function(p){
    var o = p.name || p.path;
    (p.claude_md||[]).forEach(function(f){
      add(f, {scope: f.scope === "subdir" ? "하위 폴더" : "프로젝트", origin:o, project:p.path});
    });
    addAll(p.rules, {scope:"프로젝트 rules", origin:o, project:p.path});
    addSettings(p.settings, {scope:"프로젝트 settings", origin:o, project:p.path});
    addKinds(p, o, "프로젝트", p.path);
  });
  (sc.plugins||[]).forEach(function(pl){
    var o = "플러그인 " + (pl.name || pl.key);
    add(pl.manifest, {scope:"플러그인", origin:o});
    addAll(pl.skills, {scope:"플러그인 skills", origin:o});
    addAll(pl.commands, {scope:"플러그인 commands", origin:o});
  });
  return set;
}

/* ---------- 액티비티 바 ---------- */
function renderActivity(){
  var bar = clear(document.getElementById("views"));
  VIEWS.forEach(function(v){
    var b = el("button", null, v[1]);
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(S.side === v[0]));
    b.setAttribute("aria-controls","sidebody");
    b.id = "tab-"+v[0];
    b.title = VIEW_TITLE[v[0]] + " — " + VIEW_HINT[v[0]];
    b.onclick = function(){ setSide(v[0]); };
    bar.appendChild(b);
  });
  document.getElementById("sidebody").setAttribute("aria-labelledby","tab-"+S.side);
}
// 사이드바 전환은 에디터를 건드리지 않는다 — 편집 중에도 목록 탐색 가능
function setSide(name){
  S.side = name;
  renderActivity();
  renderSide();
}

/* ---------- 탐색기 트리 ---------- */
function isOpen(id, dflt){ var v = S.expanded[id]; return v === undefined ? !!dflt : v; }
function setOpen(id, dflt){ S.expanded[id] = !isOpen(id, dflt); renderSide(); }
function rowEl(depth){
  var d = el("div","row d"+depth);
  d.style.paddingLeft = (6 + depth*14) + "px";
  return d;
}
// 표시명: 하위 폴더 CLAUDE.md 는 프로젝트 기준 상대경로
function labelOf(f){
  var m = S.meta[f.path];
  return (m && m.label) || f.name || f.path || "(이름 없음)";
}
function mainBtn(text, num, cls){
  var b = el("button","mn");
  b.appendChild(el("span","nm"+(cls?" "+cls:""), text));
  if(num != null) b.appendChild(el("span","num", String(num)));
  return b;
}
// 접기 행: 화살표는 표시용, 행 전체 버튼이 토글
function foldRow(parent, depth, id, dflt, label, num, cls){
  var open = isOpen(id, dflt);
  var r = rowEl(depth);
  r.appendChild(el("span","arw", open ? "▾" : "▸"));
  var b = mainBtn(label, num, cls);
  b.setAttribute("aria-expanded", String(open));
  b.setAttribute("data-key", id);
  b.onclick = function(){ setOpen(id, dflt); };
  r.appendChild(b);
  parent.appendChild(r);
  return open;
}
function fileTitle(f, extra){
  var t = (f.path || "") + " · " + (f.shared ? "팀 공유" : "개인");
  if(extra) t += " · " + extra;
  return t;
}
function fileRow(parent, depth, f, opts){
  opts = opts || {};
  var r = rowEl(depth);
  if(S.filePath === f.path) r.classList.add("sel");
  r.appendChild(el("span","arw",""));
  var b = mainBtn(labelOf(f), null, opts.cls);
  b.title = fileTitle(f, opts.note);
  b.setAttribute("data-key", f.path);
  b.onclick = function(){ openFile(f.path); };
  r.appendChild(b);
  parent.appendChild(r);
}
// 없는 항목: 클릭 불가 행
function emptyRow(parent, depth, label){
  var r = rowEl(depth);
  r.appendChild(el("span","arw",""));
  var b = mainBtn(label, null, "off");
  b.disabled = true;
  b.setAttribute("aria-disabled","true");
  r.appendChild(b);
  parent.appendChild(r);
}
function listNode(parent, depth, id, title, arr, kind, proj){
  arr = arr || [];
  if(!arr.length) return;
  var ov = kind ? skillOverrides(proj) : null;
  if(!foldRow(parent, depth, id, false, title, arr.length)) return;
  arr.forEach(function(f){
    var offed = ov && kind !== "agent" && ov[overrideKey(f, kind)] === "off";
    fileRow(parent, depth+1, f, offed ? {cls:"off", note:"skillOverrides OFF"} : null);
  });
}
function settingsNode(parent, depth, id, obj){
  var ks = keys(obj);
  if(!ks.length) return;
  if(!foldRow(parent, depth, id, false, "settings", ks.length)) return;
  ks.forEach(function(k){
    var v = obj[k];
    if(!v) return;
    fileRow(parent, depth+1, {path:v.path, name:k, size:v.size, mtime:v.mtime, shared:v.shared});
  });
}
function globalCount(g){
  return (g.claude_md?1:0) + len(g.rules) + keys(g.settings).length + len(g.skills) + len(g.agents) + len(g.commands);
}
function projCount(p){
  return len(p.claude_md) + len(p.rules) + keys(p.settings).length + len(p.skills) + len(p.agents) + len(p.commands);
}
function sideBody(){ return clear(document.getElementById("sidebody")); }
function sideCount(text){ document.getElementById("side-count").textContent = text || ""; }
// 사이드바 다시 그리기 — 재렌더 시 포커스 행 유지 (data-key 로 같은 버튼을 다시 찾는다)
function renderSide(){
  var host = document.getElementById("sidebody"), a = document.activeElement;
  var k = (a && host.contains(a)) ? a.getAttribute("data-key") : null;
  document.getElementById("side-title").textContent = VIEW_TITLE[S.side] || "";
  document.getElementById("sidehint").textContent = VIEW_HINT[S.side] || "";
  sideCount("");
  clear(host);
  if(S.side === "files") renderTreeBody(host);
  else if(S.side === "rules") renderRulesSide(host);
  else if(S.side === "skills") renderSkillsSide(host);
  else if(S.side === "hooks") renderHooksSide(host);
  else renderMcpSide(host);
  if(!k) return;
  var all = host.querySelectorAll("[data-key]");
  for(var i=0;i<all.length;i++){ if(all[i].getAttribute("data-key") === k){ all[i].focus(); return; } }
}
function renderTreeBody(root){
  if(!S.scan) return;
  var g = S.scan.global || {};
  var projects = S.scan.projects || [], plugins = S.scan.plugins || [];
  sideCount(projects.length + " 프로젝트");

  if(foldRow(root, 0, "g", true, "전역", globalCount(g), "b")){
    if(g.claude_md) fileRow(root, 1, g.claude_md);
    else emptyRow(root, 1, "CLAUDE.md 없음");
    listNode(root, 1, "g.rules", "rules", g.rules);
    settingsNode(root, 1, "g.settings", g.settings);
    listNode(root, 1, "g.skills", "skills", g.skills, "skill");
    listNode(root, 1, "g.agents", "agents", g.agents, "agent");
    listNode(root, 1, "g.commands", "commands", g.commands, "command");
  }
  if(foldRow(root, 0, "p", true, "프로젝트", projects.length, "b")){
    projects.forEach(function(p){ projectNode(root, p); });
  }
  if(foldRow(root, 0, "l", true, "플러그인", plugins.length, "b")){
    plugins.forEach(function(pl){ pluginNode(root, pl); });
  }
}
// 프로젝트 행은 화살표(접기)와 이름(선택)이 다른 동작 — 버튼 2개
function projectNode(parent, p){
  var id = "p:"+p.path, open = isOpen(id, false), gone = p.exists === false;
  var r = rowEl(1);
  var sel = S.project && S.project.path === p.path;
  if(sel) r.classList.add("sel");
  var tg = el("button","arw", open ? "▾" : "▸");
  tg.setAttribute("aria-expanded", String(open));
  tg.setAttribute("aria-label", (p.name||p.path)+" 하위 항목 "+(open?"접기":"펼치기"));
  tg.disabled = gone;
  if(gone) tg.textContent = "";
  tg.setAttribute("data-key", "tg:"+id);
  tg.onclick = function(){ setOpen(id, false); };
  r.appendChild(tg);
  var notes = [];
  if(gone) notes.push("경로 없음");
  if(p.coverage === "root-only") notes.push("루트만 · "+(COVER_KO[p.coverage_reason]||p.coverage_reason||"사유 미상"));
  if(p.truncated || p.incomplete) notes.push("일부만 스캔");
  var cls = gone ? "gone" : (notes.length ? "warn b" : "b");
  var d = dedupProj(p);
  var nb = mainBtn(p.name || p.path, gone ? null : projCount(d), cls);
  nb.title = p.path + (notes.length ? " · " + notes.join(" · ") : "");
  nb.setAttribute("data-key", id);
  if(sel) nb.setAttribute("aria-current","true");
  nb.onclick = function(){ selectProject(p); };
  r.appendChild(nb);
  parent.appendChild(r);
  if(gone || !open) return;
  (d.claude_md||[]).forEach(function(f){
    var lazy = f.scope === "subdir";
    fileRow(parent, 2, f, lazy ? {cls:"warn", note:"지연 로드"} : null);
  });
  listNode(parent, 2, id+".rules", "rules", d.rules);
  settingsNode(parent, 2, id+".settings", d.settings);
  listNode(parent, 2, id+".skills", "skills", d.skills, "skill", p);
  listNode(parent, 2, id+".agents", "agents", d.agents, "agent", p);
  listNode(parent, 2, id+".commands", "commands", d.commands, "command", p);
}
function pluginNode(parent, pl){
  var id = "l:"+pl.key, gone = pl.exists === false, offed = !gone && pluginOff(pl);
  var label = (pl.name || pl.key) + " " + (pl.version || "?");
  var cls = gone ? "gone" : (offed ? "off" : null);
  var open = foldRow(parent, 1, id, false, label, null, cls);
  var head = parent.lastChild.querySelector(".mn");
  head.title = (pl.path || "") + (gone ? " · 경로 없음" : (offed ? " · 플러그인 OFF" : ""));
  if(gone || !open) return;
  if(pl.manifest && pl.manifest.path)
    fileRow(parent, 2, {path:pl.manifest.path, name:"plugin.json", size:pl.manifest.size, mtime:pl.manifest.mtime, shared:pl.manifest.shared});
  listNode(parent, 2, id+".skills", "skills", pl.skills);
  listNode(parent, 2, id+".commands", "commands", pl.commands);
}
function selectProject(p){
  if(!guardEdit()) return;
  S.project = p;
  renderSide();
  loadEff();
  renderInspector();
  // ponytail: 사이드바 전환은 액티비티 바만 한다 — 프로젝트를 고른다고 트리를 감추지 않는다
}

/* ---------- 에디터 탭 줄 ---------- */
function addTab(path){
  if(S.tabs.some(function(x){ return x.path === path; })) return;   // 이미 열린 탭은 위치 유지
  var m = S.meta[path] || {};
  var seg = String(path).split(/[\\/]/);
  var t = {path:path, name: m.label || seg[seg.length-1] || path, sub: m.origin || ""};
  S.tabs.push(t);
  if(S.tabs.length > MAX_TABS) S.tabs = S.tabs.slice(S.tabs.length - MAX_TABS);
}
function closeTab(path){
  if(S.edit && S.edit.path === path && !guardEdit()) return;
  var i = S.tabs.findIndex(function(x){ return x.path === path; });
  if(i < 0) return;
  S.tabs.splice(i, 1);
  if(S.filePath !== path){ renderTabstrip(); return; }
  var next = S.tabs[i] || S.tabs[i-1];
  if(next){ openFile(next.path); return; }
  S.fseq++;    // 진행 중 파일 응답 무효
  S.file = null; S.fileErr = null; S.filePath = null; S.issues = null;
  renderSide(); renderTabstrip(); renderInspector();
  renderRaw();
}
function renderTabstrip(){
  var strip = clear(document.getElementById("tabstrip"));
  strip.setAttribute("role","tablist");
  var path = clear(document.getElementById("pathline"));
  if(!S.tabs.length) strip.appendChild(el("div","tab empty","열린 파일 없음"));
  S.tabs.forEach(function(t){
    var d = el("div","tab"+(t.path === S.filePath ? " act" : ""));
    var b = el("button","tabname");
    b.setAttribute("role","tab");
    b.setAttribute("aria-selected", String(t.path === S.filePath));
    if(t.path === S.filePath) b.setAttribute("aria-controls","panel");
    b.appendChild(el("span","tf", t.name));
    if(t.sub) b.appendChild(el("span","ts", t.sub));
    b.title = t.path;
    b.onclick = function(){ openFile(t.path); };
    d.appendChild(b);
    var x = el("button","tabx","×");
    x.setAttribute("aria-label", t.name + " 닫기");
    x.onclick = function(){ closeTab(t.path); };
    d.appendChild(x);
    strip.appendChild(d);
  });
  path.textContent = S.filePath || "";
}

/* ---------- 에디터 패널 — 언제나 열린 파일의 원문 ---------- */
function panel(){ return clear(document.getElementById("panel")); }

// 파일이 어떤 프로젝트 소속이면 그 프로젝트로 컨텍스트를 맞춘다 (전역·플러그인 파일이면 유지)
function syncProject(path){
  var m = S.meta[path];
  if(!m || !m.project) return;
  if(S.project && S.project.path === m.project) return;
  var pr = ((S.scan && S.scan.projects) || []).filter(function(x){ return x.path === m.project; })[0];
  if(!pr) return;
  S.project = pr;
  loadEff();   // 트리·인스펙터 렌더는 openFile 이 이어서 수행
}
async function openFile(path){
  if(!guardEdit()) return;
  syncProject(path);
  S.file = null; S.fileErr = null; S.filePath = path; S.issues = null;
  S.selHook = null; S.selMcp = null;   // 파일을 열면 훅·MCP 선택 해제
  addTab(path);
  renderSide();
  renderTabstrip();
  // 파일은 자체 세대(fseq) + 스캔 세대(sseq)만 본다
  var sseq = S.sseq, fseq = ++S.fseq;
  renderRaw();  // filePath 기준 "불러오는 중" 표시
  renderInspector();
  var file = null, err = null;
  try{
    file = await getJSON("/api/file?path="+encodeURIComponent(path));
  }catch(e){
    err = "파일을 불러오지 못했습니다: "+path+" — "+e.message;
  }
  if(S.dead || sseq !== S.sseq || fseq !== S.fseq) return;
  S.file = file; S.fileErr = err;
  renderRaw();
  renderInspector();
}
function renderRaw(){
  var p = panel();
  if(S.edit && S.edit.path === S.filePath) return renderEdit(p);
  if(S.fileErr){ p.appendChild(el("div","pad")).appendChild(el("p","err", S.fileErr)); return; }
  if(!S.file){
    var pd = p.appendChild(el("div","pad"));
    // 파일이 열리면 툴바가 역할을 설명하므로, 미선택일 때만 한 줄 설명
    if(!S.filePath) pd.appendChild(viewHint("왼쪽 목록에서 항목을 선택하세요 · 액티비티 바로 파일/규칙/스킬/훅/MCP 전환"));
    pd.appendChild(el("p","hint", S.filePath ? "불러오는 중… "+S.filePath : "열린 파일이 없습니다."));
    return;
  }
  p.appendChild(readBar());
  if(S.issues && S.issues.length) p.appendChild(issueList(S.issues));
  var lines = (S.file.text || "").split("\n");
  var box = el("div","code");
  // ponytail: 2000줄까지만 줄 단위 행, 나머지는 pre 한 덩어리 (행이 많으면 렌더가 느려짐)
  var n = Math.min(lines.length, MAX_LINE_ROWS);
  for(var i=0;i<n;i++){
    var row = el("div","line");
    row.appendChild(el("span","ln", String(i+1)));
    row.appendChild(el("span","src", lines[i]));
    box.appendChild(row);
  }
  if(lines.length > n) box.appendChild(el("pre","rest", lines.slice(n).join("\n")));
  p.appendChild(box);
}

/* 1-1. 편집 모드 (F3·F4·F5) */
// ponytail: 줄번호·구문강조·diff 없음. textarea 하나 + 검증/저장 버튼.
var ED = null;   // 현재 그려진 편집 DOM 참조 {path, ta, msg, issues, btns}
function isPluginFile(path){
  var m = S.meta[path] || {};
  return String(m.origin || "").indexOf("플러그인 ") === 0;
}
function tbtn(text, fn){ var b = el("button", null, text); b.onclick = fn; return b; }
// 원문(읽기) 뷰 툴바 — 편집 진입 또는 읽기 전용 안내
function readBar(){
  var bar = el("div","tbar");
  if(isPluginFile(S.filePath)) bar.appendChild(el("span","hint","읽기 전용 (플러그인)"));
  else bar.appendChild(tbtn("편집", startEdit));
  var m = S.meta[S.filePath] || {};
  if(m.shared) bar.appendChild(el("span","hint","팀 공유 (git 추적)"));
  return bar;
}
function issueList(issues){
  var box = el("div","issues");
  if(!issues.length){ box.appendChild(el("div","hint","문제 없음")); return box; }
  issues.forEach(function(it){
    var lv = it.level === "error" ? "error" : "warnlv";
    var d = el("div","iss "+lv);
    d.appendChild(el("span","rl", (it.rule || "?") + (it.line != null ? " · "+it.line+"행" : "")));
    d.appendChild(document.createTextNode(it.message || ""));
    box.appendChild(d);
  });
  return box;
}
function startEdit(){
  if(!S.file || !S.filePath || isPluginFile(S.filePath)) return;
  S.edit = {path:S.filePath, text:S.file.text || "", dirty:false,
            issues:null, busy:false, conflict:false, msg:null, msgCls:""};
  S.issues = null;
  renderRaw();
  if(ED && ED.ta) ED.ta.focus();
}
// 편집을 버려도 되는지 — 버려도 되면 편집 상태를 지우고 true
function guardEdit(){
  if(!S.edit) return true;
  if(S.edit.dirty && !confirm("저장하지 않은 변경이 있습니다. 버릴까요?")) return false;
  S.edit = null; ED = null;
  return true;
}
function cancelEdit(){
  if(!guardEdit()) return;
  renderRaw();
  renderInspector();
}
function renderEdit(p){
  var e = S.edit, m = S.meta[e.path] || {};
  var wrap = el("div","edit");
  var bar = el("div","tbar");
  var bV = tbtn("검증", doValidate), bS = tbtn("저장", doSave), bC = tbtn("취소", cancelEdit);
  bar.appendChild(bV); bar.appendChild(bS); bar.appendChild(bC);
  var st = el("span","hint", e.dirty ? "수정됨" : "변경 없음");
  bar.appendChild(st);
  wrap.appendChild(bar);
  if(m.shared) wrap.appendChild(el("div","sharewarn","git 추적 파일 — 커밋하면 팀 전체에 적용됨"));
  var msg = el("div","edmsg");
  wrap.appendChild(msg);
  var ta = el("textarea","ta");
  ta.value = e.text;
  ta.spellcheck = false;
  ta.setAttribute("aria-label", e.path + " 편집");
  ta.oninput = function(){
    if(!S.edit) return;
    S.edit.text = ta.value; S.edit.dirty = true;
    st.textContent = "수정됨";
  };
  wrap.appendChild(ta);
  var iss = el("div");
  wrap.appendChild(iss);
  p.appendChild(wrap);

// 검증/저장 응답만 반영 — textarea 는 다시 만들지 않는다 (커서·스크롤 유지)
function refreshEdit(){
  var e = S.edit;
  if(!e) return;
  if(!ED || ED.path !== e.path) return renderRaw();
  ED.btns.forEach(function(b){ b.disabled = !!e.busy; });
  var msg = clear(ED.msg);
  msg.className = "edmsg" + (e.msgCls ? " "+e.msgCls : "");
  if(e.msg) msg.appendChild(el("span", null, e.msg));
  if(e.conflict){
    var b = el("button","linkbtn","다시 읽기");
    b.onclick = reReadFile;
    msg.appendChild(b);
  }
  clear(ED.issues);
  if(e.issues) ED.issues.appendChild(issueList(e.issues));
}
function editBusy(text){
  S.edit.busy = true; S.edit.msg = text; S.edit.msgCls = "";
  refreshEdit();
}
// 응답 세대 가드: 서버 종료·편집 종료·다른 파일 편집이면 버린다
function editAlive(path){ return !S.dead && S.edit && S.edit.path === path; }
async function doValidate(){
  var e = S.edit;
  if(!e || e.busy) return;
  var path = e.path;
  editBusy("검증 중…");
  var res = null, err = null;
  try{ res = await postJSON("/api/validate", {path:path, text:S.edit.text}); }
  catch(ex){ err = ex.message; }
  if(!editAlive(path)) return;
  S.edit.busy = false;
  if(err || !res.ok){
    S.edit.issues = null;
    S.edit.msg = "검증하지 못했습니다: " + (err || resErr(res));
    S.edit.msgCls = "bad";
  }else{
    S.edit.issues = res.body.issues || [];
    S.edit.msg = null; S.edit.msgCls = "";
  }
  refreshEdit();
}
async function doSave(){
  var e = S.edit;
  if(!e || e.busy) return;
  if(e.conflict){
    e.msg = "디스크에서 변경됨 — 다시 읽기 후 저장하세요."; e.msgCls = "bad";
    refreshEdit();
    return;
  }
  var path = e.path, text = e.text;
  editBusy("저장 중…");
  var res = null, err = null;
  try{ res = await postJSON("/api/save", {path:path, text:text, mtime:(S.file && S.file.mtime)}); }
  catch(ex){ err = ex.message; }
  if(!editAlive(path)) return;
  S.edit.busy = false;
  if(err){
    S.edit.msg = "저장하지 못했습니다: " + err; S.edit.msgCls = "bad";
    return refreshEdit();
  }
  var b = res.body;
  if(res.status === 200){
    if(S.file && S.filePath === path){
      S.file.text = text;
      if(b.mtime != null) S.file.mtime = b.mtime;
      if(b.size != null) S.file.size = b.size;
    }
    S.edit = null; ED = null;
    S.issues = (b.issues && b.issues.length) ? b.issues : null;   // warn 은 저장 후에도 남긴다
    S.msg = "저장됨 · 백업 " + (b.backup || "(경로 미상)");
    S.msgOk = true;
    renderRaw();
    renderInspector();
    return;
  }
  if(res.status === 422){
    S.edit.issues = b.issues || [];
    S.edit.msg = "검증 오류가 있어 저장하지 않았습니다."; S.edit.msgCls = "bad";
  }else if(res.status === 409){
    S.edit.conflict = true;
    S.edit.msg = "디스크에서 변경됨 — 다시 읽기 후 저장할 수 있습니다.";
    S.edit.msgCls = "bad";
  }else{
    S.edit.msg = "저장하지 못했습니다: " + resErr(res); S.edit.msgCls = "bad";
  }
  refreshEdit();
}
// 409 복구: 디스크 원문만 다시 받는다 — textarea 편집본은 그대로 (§11.3)
async function reReadFile(){
  var e = S.edit;
  if(!e || e.busy) return;
  var path = e.path;
  editBusy("다시 읽는 중…");
  var file = null, err = null;
  try{ file = await getJSON("/api/file?path="+encodeURIComponent(path)); }
  catch(ex){ err = ex.message; }
  if(!editAlive(path)) return;
  S.edit.busy = false;
  if(err){
    S.edit.msg = "다시 읽지 못했습니다: " + err; S.edit.msgCls = "bad";
    return refreshEdit();
  }
  if(S.filePath === path) S.file = file;
  S.edit.conflict = false;
  S.edit.msg = "디스크 내용을 다시 읽었습니다. 편집본은 그대로이며, 저장하면 덮어씁니다.";
  S.edit.msgCls = "";
  refreshEdit();
  renderInspector();
}

/* 2. 유효 규칙 — 인스펙터 `함께 적용됨`과 같은 데이터를 공유 */

function renderRulesSide(root){
  if(!S.project){ sideMsg(root, "파일 사이드바에서 프로젝트를 선택하세요."); return; }

/* 3. 스킬·에이전트·커맨드 */
// PRD §5 우선순위: 전역 스킬 → 프로젝트 스킬 → 에이전트 → 커맨드(전역·프로젝트) → 플러그인
function rankOf(kind, scope){       // scope: 0 전역, 1 프로젝트, 2 플러그인
  if(scope === 2) return 5;
  if(kind === "skill") return scope;
  if(kind === "agent") return 2 + scope;
  return 4;
}
// skills/ 아래 SKILL.md 가 아닌 부속 문서(reference.md 등)는 스킬이 아니다
function isSkillFile(f){ return !!f.name_meta || f.name === "SKILL.md"; }
function collect(){
  var out = [], g = (S.scan && S.scan.global) || {}, ov = skillOverrides();
  function push(arr, kind, scope, origin, extra){
    (arr||[]).forEach(function(f){
      if(kind === "skill" && !isSkillFile(f)) return;
      var key = overrideKey(f, kind);
      out.push({name:f.name_meta || key, kind:kind, origin:origin, rank:rankOf(kind, scope),
                desc:f.description, path:f.path, key:key, pluginOwned: scope === 2,
                off: extra ? extra.off : (kind !== "agent" && ov[key] === "off"),
                offLabel: extra ? extra.offLabel : "이 프로젝트에서 OFF"});
    });
  }
  push(g.skills,"skill",0,"전역"); push(g.agents,"agent",0,"전역"); push(g.commands,"command",0,"전역");
  if(S.project && S.project.exists !== false){
    push(S.project.skills,"skill",1,"프로젝트");
    push(S.project.agents,"agent",1,"프로젝트");
    push(S.project.commands,"command",1,"프로젝트");
  }
  ((S.scan && S.scan.plugins) || []).forEach(function(pl){
    if(pl.exists === false) return;
    // 플러그인 스킬에는 skillOverrides 미적용 (F7) — 플러그인 단위 OFF만
    var extra = {off: pluginOff(pl), offLabel:"플러그인 OFF"}, origin = "플러그인:"+(pl.name || pl.key);
    push(pl.skills,"skill",2,origin,extra);
    push(pl.commands,"command",2,origin,extra);
  });
  out.sort(function(a,b){ return a.rank - b.rank || a.name.localeCompare(b.name); });
  return out;
}
// 출처 섹션 — collect() 의 origin 문자열에서 되읽는다 (collect 는 그대로 둔다)
function cardSrc(c){
  if(c.origin === "전역") return {key:"g", label:"전역", rank:0};
  if(c.origin === "프로젝트") return {key:"p", label:"이 프로젝트", rank:1};
  var nm = c.origin.indexOf("플러그인:") === 0 ? c.origin.slice(5) : c.origin;
  return {key:"pl:"+nm, label:"플러그인 "+nm, rank:2, plugin:nm};
}
function cardMatch(c){
  if(!S.cardq.kinds[c.kind]) return false;
  var q = S.cardq.q.trim().toLowerCase();
  if(!q) return true;
  return String(c.name||"").toLowerCase().indexOf(q) >= 0
      || String(c.desc||"").toLowerCase().indexOf(q) >= 0;
}
// 사이드바 상단 검색 + 종류 칩. 툴바는 다시 그리지 않는다 — 행 영역만 갱신해야 입력 포커스가 유지된다

// 컨트롤 변경 → POST /api/toggle → 200이면 제자리 반영, 실패면 오류 줄 + 컨트롤 원복
async function doToggle(section, key, value, ctrls){
  if(!toggleReady()) return;
  S.toggleErr = null;
  ctrls.forEach(function(c){ c.disabled = true; });
  renderToggleNotes();
  var sseq = S.sseq, res = null, err = null;
  try{
    res = await postJSON("/api/toggle", {project:S.project.path, section:section, key:key,
                                         value:value, target:S.toggleTarget});
  }catch(ex){ err = ex.message; }
  if(S.dead || sseq !== S.sseq) return;
  if(!err && res.status === 200){ applyToggle(res.body, section, key); return; }
  S.toggleErr = "토글하지 못했습니다: "
    + (err || ("HTTP " + res.status + " — " + ((res.body && res.body.error) || "요청 실패")));
  renderSide();          // 컨트롤 원복 = 현재 스캔 값 기준 재렌더

// 토글 성공 → 재스캔 없이 스캔 상태를 제자리에서 갱신하고 사이드바·인스펙터만 다시 그린다.
// ponytail: 서버 응답(path/value/created)이 곧 디스크 상태. 전체 재스캔은 사용자가 재스캔 버튼을 누를 때만.
function applyToggle(body, section, key){
  var p = S.project, sets = p.settings || (p.settings = {});
  var name = S.toggleTarget, entry = sets[name];
  if(!entry || !entry.data || typeof entry.data !== "object"){
    entry = sets[name] = {path: body.path, data: {}, mtime: null, size: null, shared: false};
  }
  var sec = entry.data[section];
  if(!sec || typeof sec !== "object") sec = entry.data[section] = {};
  if(body.value === null || body.value === undefined){
    delete sec[key];
    if(!keys(sec).length) delete entry.data[section];
  }else sec[key] = body.value;
  if(body.created) S.meta = scanIndex(S.scan);
  renderSide();
  renderInspector();
}
var LEVELS = [["on","on (제한 없음)"],["name-only","name-only (이름만)"],

function skillCtrls(c){

  LEVELS.forEach(function(o){

// 플러그인 섹션 헤더의 ON/OFF — enabledPlugins 는 플러그인 단위

function renderCardBody(){

    var open = searching || isOpen(id, dflt);

/* 4. 훅 흐름 */
function hookCmds(h){
  return Array.isArray(h.commands) ? h.commands : (h.commands ? [h.commands] : []);
}
function hookSource(src){
  src = String(src || "");
  if(src.indexOf("global:") === 0) return {cls:"global", label:"전역 · "+src.slice(7)};
  if(src.indexOf("plugin:") === 0) return {cls:"plugin", label:"플러그인 · "+src.slice(7)};
  if(src.indexOf("project:") === 0){
    var rest = src.slice(8), i = rest.lastIndexOf(":");
    return i > 0 ? {cls:"project", label:"프로젝트 · "+rest.slice(0,i)+" · "+rest.slice(i+1)}
                 : {cls:"project", label:"프로젝트 · "+rest};
  }
  return {cls:"", label:src || "출처 미상"};
}
function groupHooks(hooks){
  // 이벤트명이 constructor/__proto__ 여도 안전하도록 프로토타입 없는 객체
  var order = [], byEvent = Object.create(null);
  hooks.forEach(function(h){
    var e = h.event || "(이벤트 없음)";
    if(!byEvent[e]){ byEvent[e] = []; order.push(e); }
    byEvent[e].push(h);
  });
  return {order:order, byEvent:byEvent};
}
// 훅 출처가 settings 파일이면 그 파일 경로 — 플러그인 출처는 열 파일이 없다
function hookFile(src){
  src = String(src || "");
  var g = (S.scan && S.scan.global) || {};
  if(src.indexOf("global:") === 0){
    var e = (g.settings || {})[src.slice(7)];
    return (e && e.path) || null;
  }
  if(src.indexOf("project:") === 0){
    var rest = src.slice(8), i = rest.lastIndexOf(":");
    if(i <= 0) return null;
    var path = rest.slice(0, i), name = rest.slice(i+1);
    var pr = ((S.scan && S.scan.projects) || []).filter(function(x){ return x.path === path; })[0];
    var pe = pr && (pr.settings || {})[name];
    return (pe && pe.path) || null;
  }
  return null;
}
function hookKey(h){ return (h.event||"") + "|" + (h.matcher||"") + "|" + (h.source||""); }
function selectHook(h){
  var f = hookFile(h.source);
  if(f) openFile(f);      // openFile 이 선택을 지우므로 바로 되살린다
  S.selHook = h; S.selMcp = null;
  renderSide();
  renderInspector();
}
/* 사이드바 4. 훅 — 이벤트별 그룹 → 매처 행 */
function renderHooksSide(root){
  var hooks = (S.scan && S.scan.hooks) || [];
  sideCount(hooks.length + "개");
  if(!hooks.length){ sideMsg(root, "등록된 훅이 없습니다."); return; }
  var g = groupHooks(hooks), sel = S.selHook ? hookKey(S.selHook) : null;
  g.order.forEach(function(ev){
    root.appendChild(el("div","sechd", ev+" ("+g.byEvent[ev].length+")"));
    g.byEvent[ev].forEach(function(h){
      var src = hookSource(h.source), n = hookCmds(h).length;
      sideItem(root, {text: "매처 " + (h.matcher || "(없음)"), key: "hook:"+hookKey(h),
        title: src.label + " → " + (hookCmds(h).join(" · ") || "(명령 없음)"),
        cls: src.cls, sel: sel === hookKey(h),
        badges: [badge("명령 "+n+"개"),
                 h.warn === "duplicate-star" ? badge("⚠ * 매처와 중복 발화","warn") : null],
        onclick: function(){ selectHook(h); }});
    });
  });
}

/* 사이드바 5. MCP — 출처별 그룹 → 서버 행 */
// 출처 그룹: {key, label, file, items:[{name, config}]}
function mcpGroups(){
  var order = [], by = Object.create(null);
  function grp(key, label, file){
    if(!by[key]){ by[key] = {key:key, label:label, file:file || null, items:[]}; order.push(by[key]); }
    return by[key];
  }
  ((S.scan && S.scan.mcp) || []).forEach(function(m){
    var s = m.source || "(출처 없음)";
    var label = s === "global" ? "전역"
      : s.indexOf("project:") === 0 ? "프로젝트 · "+s.slice(8)
      : s.indexOf("plugin:") === 0 ? "플러그인 · "+s.slice(7) : s;
    grp("src:"+s, label).items.push(m);
  });
  ((S.scan && S.scan.plugins) || []).forEach(function(pl){
    if(pl.exists === false) return;
    var srv = pl.mcp_servers || {};
    keys(srv).forEach(function(n){
      grp("plugin:"+pl.key, "플러그인 · "+(pl.name || pl.key)).items.push({name:n, config:srv[n]});
    });
  });
  // 프로젝트 루트 .mcp.json — 선택 프로젝트가 있으면 그 프로젝트만
  var projs = (S.project && S.project.exists !== false) ? [S.project] : ((S.scan && S.scan.projects) || []);
  projs.forEach(function(pr){
    var mj = pr.mcp_json;
    if(!mj || !mj.data || typeof mj.data !== "object") return;
    var srv = mj.data.mcpServers || {};
    keys(srv).forEach(function(n){
      grp("pmcp:"+(mj.path || pr.path || ""), "프로젝트 .mcp.json · "+(pr.name || pr.path), mj.path)
        .items.push({name:n, config:srv[n]});
    });
  });
  return order;
}
function selectMcp(m){
  if(m.file) openFile(m.file);   // openFile 이 선택을 지우므로 바로 되살린다
  S.selMcp = m; S.selHook = null;
  renderSide();
  renderInspector();
}
function renderMcpSide(root){
  var groups = mcpGroups(), n = 0;
  groups.forEach(function(g){ n += g.items.length; });
  sideCount(n + "개");
  if(!groups.length){ sideMsg(root, "등록된 MCP 서버가 없습니다."); return; }
  groups.forEach(function(g){
    root.appendChild(el("div","sechd", g.label + " (" + g.items.length + ")"));
    g.items.forEach(function(it){
      var cfg = (it.config && typeof it.config === "object") ? it.config : {};
      var sel = {name:it.name, config:it.config, label:g.label, file:g.file};
      sideItem(root, {text: it.name || "(이름 없음)", key: "mcp:"+g.key+":"+it.name,
        title: g.label + " · " + (cfg.command || cfg.url || "-"),
        sel: !!(S.selMcp && S.selMcp.name === it.name && S.selMcp.label === g.label),
        badges: [badge(cfg.command ? "command" : (cfg.url ? "url" : "설정 없음"))],
        onclick: function(){ selectMcp(sel); }});
    });
  });
}

      var hl = el("div","hooklist");
      mine.forEach(function(h){
        var line = (h.event||"?") + " · " + (h.matcher || "(없음)") + " → " + (hookCmds(h).join(", ") || "(명령 없음)");
        var d = el("div","hookitem", line);
        if(h.warn === "duplicate-star"){
          d.appendChild(el("span","warn", " · * 매처와 중복 발화"));
        }
        hl.appendChild(d);
      });
      hs.appendChild(hl);
    }
  }
  ins.appendChild(el("div","spacer"));
  var acts = el("div","acts");
  var re = el("button", null, S.loading ? "스캔 중…" : "재스캔");
  re.disabled = S.loading; re.onclick = loadScan; acts.appendChild(re);
  var sd = el("button", null, "종료"); sd.onclick = shutdown; acts.appendChild(sd);
  ins.appendChild(acts);
}
async function shutdown(){
  if(S.dead) return;
  if(!guardEdit()) return;
  var fail = null;
  try{
    var r = await fetch("/api/shutdown",{method:"POST"}), b = null;
    try{ b = await r.json(); }catch(e){}
    if(!r.ok || !b || b.ok !== true) fail = (b && b.error) || ("HTTP "+r.status);
  }catch(e){ fail = e.message; }
  if(fail){  // 실패면 UI 유지, 인스펙터에만 표시
    S.msg = "종료하지 못했습니다: "+fail; S.msgOk = false;
    renderInspector();
    return;
  }
  S.dead = true;
  document.body.textContent = "";
  var p = el("p",null,"서버가 종료되었습니다");
  p.style.padding = "24px";
  document.body.appendChild(p);
}

/* ---------- 부트 ---------- */
async function loadScan(){
  if(S.dead || S.loading) return;   // 진행 중 재스캔 재요청은 무시
  if(!guardEdit()) return;
  // 복원용 선택은 미리 잡아 두고, 상태 교체는 완료 시점에만
  var prevProject = S.project && S.project.path, prevFile = S.filePath;
  var seq = ++S.sseq;   // 실패해도 되돌리지 않는다
  S.loading = true; S.msg = null; S.msgOk = false; S.scanErr = false;
  renderInspector();
  sideBody().appendChild(el("div","pad hint","스캔 중…"));
  panel().appendChild(el("div","pad hint","스캔 중…"));
  var scan = null, err = null;
  try{
    scan = await getJSON(SAMPLE ? "./scan-sample.json" : "/api/scan");
  }catch(e){ err = e.message; }
  S.loading = false;
  if(S.dead || seq !== S.sseq) return;
  if(err){  // 이전 스캔 데이터는 유지 — 사이드바도 그대로 두어 에디터와 어긋나지 않게
    S.msg = "스캔에 실패했습니다: "+err; S.msgOk = false; S.scanErr = true;
    if(S.scan) renderSide();
    // 세대(sseq)는 되돌리지 않는다 — 스캔 중 도착해 폐기된 응답은 지금 다시 요청해 복구
    // 복구 호출을 패널 렌더보다 먼저 — 복구가 패널을 다시 그려도 오류는 인스펙터에 남는다
    if(S.project && !S.eff && !S.effErr) loadEff();
    if(S.filePath && !S.file && !S.fileErr) openFile(S.filePath);
    renderInspector();
    var q = panel(), qp = el("div","pad");
    q.appendChild(qp);
    qp.appendChild(el("p","err", S.msg));
    qp.appendChild(retryBtn(loadScan));
    return;
  }
  S.scan = scan;
  S.meta = scanIndex(scan);
  // 이전 선택 복원
  S.project = null; S.file = null; S.fileErr = null; S.filePath = null;
  S.eff = null; S.effErr = null; S.eseq++; S.selHook = null; S.selMcp = null;
  S.tabs = S.tabs.filter(function(t){ return !!S.meta[t.path]; });
  if(prevProject){
    var found = (scan.projects||[]).filter(function(x){ return x.path === prevProject; })[0];
    if(found) S.project = found;
    else { S.msg = "재스캔 후 프로젝트가 사라져 선택을 해제했습니다: "+prevProject; S.msgOk = false; }
  }
  if(prevFile && !S.meta[prevFile]){
    S.fileErr = "재스캔 후 파일이 사라졌습니다: "+prevFile;
    prevFile = null;
  }
  if(S.project) loadEff();
  renderActivity();
  renderSide();
  renderTabstrip();
  renderInspector();
  renderRaw();
  if(prevFile) openFile(prevFile);
}
// 편집 중 Ctrl+S = 저장, 브라우저 닫기 = 경고
document.addEventListener("keydown", function(ev){
  if(!S.edit || !(ev.ctrlKey || ev.metaKey)) return;
  if(ev.key !== "s" && ev.key !== "S") return;
  ev.preventDefault();
  doSave();
});
window.addEventListener("beforeunload", function(ev){
  if(S.edit && S.edit.dirty){ ev.preventDefault(); ev.returnValue = ""; }
});
renderActivity();
renderSide();
renderTabstrip();
renderInspector();
loadScan();
</script>
</body>
